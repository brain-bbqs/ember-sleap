<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EMBER SLEAP</title>
    <link rel="icon" type="image/png" href="./assets/sleap-logo-QmtXJJ2h.png" />
    <script type="module" crossorigin src="./assets/index-DcfQzxfu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CqwJpC5-.css">
  </head>
  <body>
    <a
      class="brand-watermark-link"
      href="https://brain-bbqs.org"
      target="_blank"
      rel="noopener"
      aria-label="BBQS"
      title="BBQS"
    >
      <img class="brand-watermark-logo" src="./assets/bbqs-logo-DsiqigcO.png" alt="BBQS" />
    </a>

    <main class="workspace">
      <header class="site-header">
        <a
          class="header-logo-link plugin-logo"
          href="https://sleap.ai"
          target="_blank"
          rel="noopener"
          aria-label="SLEAP, an EMBER plugin"
          title="SLEAP, an EMBER plugin"
        >
          <img class="header-logo" src="./assets/sleap-logo-QmtXJJ2h.png" alt="SLEAP" />
          <img class="plugin-logo-badge" src="./assets/ember-badge-C111EwX_.svg" alt="" />
        </a>
        <h1>EMBER SLEAP</h1>
      </header>

      <!-- Where the SLEAP app will mount, filling the window between the header and the footer. -->
      <div class="sleap-root"></div>

      <!-- The BBQS footer, without its What's New and issue links: the version stamp bottom-left,
           the brand marks bottom-right. A row of the page's column rather than pinned over it, so
           the app above ends where it begins. -->
      <footer class="page-footer-bar">
        <div class="footer-left">
          <div class="footer-row">
            <!-- Text is filled in from __APP_VERSION__ by src/main.ts. -->
            <a
              id="version-indicator"
              class="version-link"
              href="https://github.com/brain-bbqs/ember-sleap"
              target="_blank"
              rel="noopener"
              title="View source on GitHub"
            ></a>
          </div>
        </div>
        <div class="footer-brands">
          <!-- The Talmo Lab mark is a wordless flask, so its name is spelled out beneath it, as
               clip-extractor and encoding-helper show it; this page is dark only, so it takes the
               flask drawn for dark backgrounds. -->
          <a
            class="footer-brand-link captioned"
            href="https://talmolab.org/"
            target="_blank"
            rel="noopener"
            aria-label="Talmo Lab"
            title="Talmo Lab"
          >
            <img class="footer-brand-logo" src="data:image/svg+xml,%3c!--%20Talmo%20Lab%20logo,%20white-stroke%20variant%20for%20dark%20backgrounds;%20see%20talmolab-logo.svg.%20--%3e%3csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='-60%20-65%20120%20120'%3e%3ccircle%20fill='%23b3e5fc'%20cx='-3'%20cy='-50'%20r='3'%20opacity='0.3'%20/%3e%3ccircle%20fill='%23b3e5fc'%20cx='2'%20cy='-40'%20r='3'%20opacity='0.5'%20/%3e%3ccircle%20fill='%23b3e5fc'%20cx='-1'%20cy='-30'%20r='3'%20opacity='0.7'%20/%3e%3ccircle%20fill='%23b3e5fc'%20cx='3'%20cy='-20'%20r='3'%20opacity='0.9'%20/%3e%3cpath%20fill='%2381d4fa'%20d='%20M%200.0%20-15.0%20L%20-21.7%20-2.5%20L%20-21.7%2022.5%20L%20-0.0%2035.0%20L%2021.7%2022.5%20L%2021.7%20-2.5%20z%20'%20/%3e%3cpath%20fill='%23b3e5fc'%20d='%20M%200.0%20-15.0%20L%20-21.7%20-2.5%20L%200%2010%20L%2021.7%20-2.5%20z%20'%20/%3e%3cpath%20fill='none'%20stroke='%23ffffff'%20stroke-width='8'%20stroke-linecap='round'%20stroke-linejoin='round'%20d='%20M%20-45%20-53%20L%20-15%20-53%20L%20-15%20-19.2%20L%20-30.3%20-7.5%20L%20-30.3%2027.5%20L%20-0%2045%20L%2030.3%2027.5%20L%2030.3%20-7.5%20L%2015%20-19.2%20L%2015%20-53%20L%2045%20-53%20'%20/%3e%3c/svg%3e" alt="" />
            <span class="footer-brand-name">Talmo Lab</span>
          </a>
          <a
            class="footer-brand-link"
            href="https://centerforopenneuroscience.org"
            target="_blank"
            rel="noopener"
            aria-label="Center for Open Neuroscience"
            title="Center for Open Neuroscience"
          >
            <img class="footer-brand-logo" src="./assets/con-logo-F8_OuRqh.png" alt="Center for Open Neuroscience" />
          </a>
        </div>
      </footer>
    </main>

  </body>
</html>
