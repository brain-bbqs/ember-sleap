# The agent skills this repository installs, each an APM package pinned to a commit.
# `apm install --frozen` writes them into .claude/skills/ and .agents/skills/, where the copies are
# generated and git-ignored: no copy is committed. Improve a skill in its own repository, then move
# its pin here.
name: ember-sleap
version: 1.0.0
description: Agent skills this app installs from shared collections.
targets:
  - claude
  - agent-skills
dependencies:
  apm:
    - git: con/skills
      ref: 71e788c662d97165881b1dbc733dcd34210d979d
      skills:
        - setup-chromatic
    - brain-bbqs/bbqs-web-components/skills/frontend-security#66c335e3612f4fa977a85a92210f23158a12608d
    - brain-bbqs/bbqs-web-components/skills/reuse-license-setup#66c335e3612f4fa977a85a92210f23158a12608d
    - brain-bbqs/bbqs-web-components/skills/visual-snapshots#66c335e3612f4fa977a85a92210f23158a12608d
  mcp: []
includes: auto
scripts: {}
