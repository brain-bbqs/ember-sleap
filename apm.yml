# The agent skills this repository installs: its own, from .apm/skills/, and shared ones, each
# pinned to a commit. `apm install --frozen` writes them all into .claude/skills/ and
# .agents/skills/, where the copies are generated and git-ignored: edit this repository's own in
# .apm/skills/, and improve a shared one in its own repository, then move the pin here.
name: ember-sleap
version: 1.0.0
description: Agent skills this app installs from shared collections.
targets:
  - claude
  - agent-skills
dependencies:
  apm:
    - git: con/skills
      ref: 71e788c662d97165881b1dbc733dcd34210d979d
      skills:
        - setup-chromatic
  mcp: []
includes: auto
scripts: {}
